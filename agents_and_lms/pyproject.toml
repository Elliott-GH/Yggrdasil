[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrasil-agents"
version = "0.5.0"
description = "Single-responsibility local-to-cloud micro-agent package for the Yggdrasil AI ecosystem."
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-ai>=1.0.0",
    "openai>=1.30.0",
    "google-genai>=1.0.0",
    "google-antigravity>=0.1.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yggdrasil_agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["yggdrasil_agents", "studio"]

[tool.mypy]
python_version = "3.11"
strict = true
